<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.webp" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="清北大学 · 智汇校园一站式智慧校园服务平台" />
    <meta name="theme-color" content="#f0f7ff" />
    <title>清北大学 · 智汇校园一站式服务平台</title>
    <!-- 首屏背景预加载：门面页（登录/首页）LCP 关键资源 -->
    <link rel="preload" as="image" href="/web-pc.webp" media="(min-width: 769px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/web-phont.webp" media="(max-width: 768px)" fetchpriority="high" />
    <!--
      启动页样式（内联，随文档一起到达即生效，不额外发请求）。
      ★ 为什么放这里：main.js 的挂载门控要等「首个路由就绪」（含登录态恢复 + 懒加载 chunk），
        这段时间此前 #app 是空的 → 用户看到的是**整页白屏**。启动页把这整段等待变成有品牌的加载态。
      ★ CSP 允许：edgeone.json 的 style-src 含 'unsafe-inline'；此处**不含任何内联脚本**（script-src 仅 'self'）。
      ★ 生命周期：#app 内的这段静态标记会在 Vue `app.mount()` 时被自动清空（见 src/main.js）。
        若 JS 加载失败，它会**留在屏幕上**当兜底，比白屏可读。
    -->
    <style>
      html { background: #f0f7ff; }
      .zc-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f0f7ff;
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
        color: #17325c;
      }
      .zc-boot-brand { display: flex; align-items: center; gap: 14px; }
      .zc-boot-brand img:first-child { width: 56px; height: 56px; }
      .zc-boot-brand img:last-child { height: 32px; }
      .zc-boot-sub { font-size: 13px; letter-spacing: 0.6px; color: #64748b; }
      .zc-boot-ring {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(37, 99, 235, 0.18);
        border-top-color: #2563eb;
        animation: zc-boot-spin 0.8s linear infinite;
      }
      @keyframes zc-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .zc-boot-ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 启动页：等待首路由就绪期间展示，挂载时被 Vue 清空 -->
      <div class="zc-boot">
        <div class="zc-boot-brand">
          <img src="/logo.webp" alt="" />
          <img src="/name.webp" alt="清北大学" />
        </div>
        <div class="zc-boot-sub">智汇校园 · 一站式智慧校园服务平台</div>
        <div class="zc-boot-ring" role="progressbar" aria-label="正在加载"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
